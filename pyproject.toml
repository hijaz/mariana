[project]
name = "mariana"
version = "0.1.0"
description = "Free, local deep research agent"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langgraph>=0.2.0",
    "langsmith>=0.1.0",
    "click>=8.1.0",
    "httpx>=0.27.0",
    "trafilatura>=1.12.0",
    "readability-lxml>=0.8.1",
    "markdownify>=0.13.0",
    "pypdf>=4.0.0",
    "rich>=13.7.0",
    "tenacity>=8.3.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "sse-starlette>=2.1.0",
    "searxng @ git+https://github.com/searxng/searxng.git@main",
]

[project.scripts]
mariana = "mariana.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mariana"]
